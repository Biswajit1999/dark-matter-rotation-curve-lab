<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="220" viewBox="0 0 1120 220" role="img" aria-labelledby="t d"><title id="t">Evidence flow</title><desc id="d">The repository traces a scientific claim from observation through calibration, equations, models and uncertainty to inference, competing explanation and a new discriminating measurement.</desc><rect width="100%" height="100%" fill="#07100f"/><text x="40" y="38" fill="#f4f7fb" font-family="system-ui,sans-serif" font-size="22" font-weight="650">Follow the evidence, not the aesthetic</text><rect x="40" y="82" width="112" height="62" rx="4" fill="#10201e" stroke="#2a3f3b"/><text x="96" y="118" fill="#dce7e4" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">Observation</text><path d="M152 113 H160" stroke="#54b8ea" stroke-width="2"/><path d="M154 107 l8 6 -8 6" fill="none" stroke="#54b8ea" stroke-width="2"/><rect x="170" y="82" width="112" height="62" rx="4" fill="#0b1514" stroke="#2a3f3b"/><text x="226" y="118" fill="#dce7e4" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">Calibration</text><path d="M282 113 H290" stroke="#54b8ea" stroke-width="2"/><path d="M284 107 l8 6 -8 6" fill="none" stroke="#54b8ea" stroke-width="2"/><rect x="300" y="82" width="112" height="62" rx="4" fill="#0b1514" stroke="#2a3f3b"/><text x="356" y="118" fill="#dce7e4" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">Equation</text><path d="M412 113 H420" stroke="#54b8ea" stroke-width="2"/><path d="M414 107 l8 6 -8 6" fill="none" stroke="#54b8ea" stroke-width="2"/><rect x="430" y="82" width="112" height="62" rx="4" fill="#0b1514" stroke="#2a3f3b"/><text x="486" y="118" fill="#dce7e4" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">Model</text><path d="M542 113 H550" stroke="#54b8ea" stroke-width="2"/><path d="M544 107 l8 6 -8 6" fill="none" stroke="#54b8ea" stroke-width="2"/><rect x="560" y="82" width="112" height="62" rx="4" fill="#0b1514" stroke="#2a3f3b"/><text x="616" y="118" fill="#dce7e4" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">Uncertainty</text><path d="M672 113 H680" stroke="#54b8ea" stroke-width="2"/><path d="M674 107 l8 6 -8 6" fill="none" stroke="#54b8ea" stroke-width="2"/><rect x="690" y="82" width="112" height="62" rx="4" fill="#0b1514" stroke="#2a3f3b"/><text x="746" y="118" fill="#dce7e4" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">Inference</text><path d="M802 113 H810" stroke="#54b8ea" stroke-width="2"/><path d="M804 107 l8 6 -8 6" fill="none" stroke="#54b8ea" stroke-width="2"/><rect x="820" y="82" width="112" height="62" rx="4" fill="#0b1514" stroke="#2a3f3b"/><text x="876" y="118" fill="#dce7e4" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">Challenge</text><path d="M932 113 H940" stroke="#54b8ea" stroke-width="2"/><path d="M934 107 l8 6 -8 6" fill="none" stroke="#54b8ea" stroke-width="2"/><rect x="950" y="82" width="112" height="62" rx="4" fill="#0b1514" stroke="#f4b860"/><text x="1006" y="118" fill="#dce7e4" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">New test</text><text x="40" y="178" fill="#91a49d" font-family="ui-monospace,monospace" font-size="11">OBSERVED → DERIVED → MODEL-DEPENDENT → TESTABLE AGAIN</text></svg>
