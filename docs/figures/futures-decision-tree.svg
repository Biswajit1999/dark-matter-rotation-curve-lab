<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="240" viewBox="0 0 1040 240" role="img" aria-labelledby="t d"><title id="t">Physics-constrained dark-matter technology ladder</title><desc id="d">A technology requires successive discoveries: identity, coupling, control, capture, energy transfer and momentum transfer before engineering becomes meaningful.</desc><rect width="100%" height="100%" fill="#07100f"/><text x="40" y="42" fill="#f4f7fb" font-family="system-ui,sans-serif" font-size="22" font-weight="650">Discovery does not imply technology</text><text x="40" y="65" fill="#91a49d" font-family="ui-monospace,monospace" font-size="11">EACH ARROW IS A PHYSICS GATE, NOT A FORECAST</text><circle cx="85" cy="130" r="38" fill="#0b1514" stroke="#54b8ea" stroke-width="2"/><text x="85" y="134" fill="#dce7e4" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">Identity</text><path d="M124 130 H182" stroke="#2a3f3b" stroke-width="2"/><circle cx="225" cy="130" r="38" fill="#0b1514" stroke="#54b8ea" stroke-width="2"/><text x="225" y="134" fill="#dce7e4" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">Coupling</text><path d="M264 130 H322" stroke="#2a3f3b" stroke-width="2"/><circle cx="365" cy="130" r="38" fill="#0b1514" stroke="#54b8ea" stroke-width="2"/><text x="365" y="134" fill="#dce7e4" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">Control</text><path d="M404 130 H462" stroke="#2a3f3b" stroke-width="2"/><circle cx="505" cy="130" r="38" fill="#0b1514" stroke="#54b8ea" stroke-width="2"/><text x="505" y="134" fill="#dce7e4" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">Capture</text><path d="M544 130 H602" stroke="#2a3f3b" stroke-width="2"/><circle cx="645" cy="130" r="38" fill="#0b1514" stroke="#54b8ea" stroke-width="2"/><text x="645" y="134" fill="#dce7e4" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">Energy transfer</text><path d="M684 130 H742" stroke="#2a3f3b" stroke-width="2"/><circle cx="785" cy="130" r="38" fill="#0b1514" stroke="#54b8ea" stroke-width="2"/><text x="785" y="134" fill="#dce7e4" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">Momentum</text><path d="M824 130 H882" stroke="#2a3f3b" stroke-width="2"/><circle cx="925" cy="130" r="38" fill="#2b2214" stroke="#f4b860" stroke-width="2"/><text x="925" y="134" fill="#dce7e4" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11">Engineering</text><text x="40" y="205" fill="#91a49d" font-family="system-ui,sans-serif" font-size="12">Known weak interactions can make the chain stop at sensing. A failed engine is a scientific result.</text></svg>
