<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="t d"><title id="t">Reference cosmic budget</title><desc id="d">Planck-like base flat Lambda CDM reference: 4.9 percent baryonic matter, 26.4 percent cold dark matter and 68.7 percent dark energy.</desc><rect width="100%" height="100%" fill="#07100f"/><text x="50" y="44" fill="#f4f7fb" font-family="system-ui,sans-serif" font-size="24" font-weight="650">A modelled cosmic ledger</text><text x="50" y="68" fill="#91a49d" font-family="ui-monospace,monospace" font-size="12">REFERENCE · BASE FLAT ΛCDM · PRESENT EPOCH</text><rect x="50" y="96" width="42.14" height="70" fill="#f4f7fb"/><text x="71.07" y="137" fill="#07100f" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700">4.9%</text><rect x="92.14" y="96" width="227.04" height="70" fill="#54b8ea"/><text x="205.66" y="137" fill="#07100f" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700">26.4%</text><rect x="319.18" y="96" width="590.82" height="70" fill="#b1a7ff"/><text x="614.59" y="137" fill="#07100f" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700">68.7%</text><circle cx="70" cy="218" r="5" fill="#f4f7fb"/><text x="82" y="223" fill="#c8d1df" font-family="system-ui,sans-serif" font-size="13">Ordinary matter</text><circle cx="350" cy="218" r="5" fill="#54b8ea"/><text x="362" y="223" fill="#c8d1df" font-family="system-ui,sans-serif" font-size="13">Cold dark matter</text><circle cx="630" cy="218" r="5" fill="#b1a7ff"/><text x="642" y="223" fill="#c8d1df" font-family="system-ui,sans-serif" font-size="13">Dark energy</text></svg>
