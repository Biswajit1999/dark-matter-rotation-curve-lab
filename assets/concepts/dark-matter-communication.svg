<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Hypothetical dark-sector communication concept</title><desc id="d">Two stations separated by a planet with a dashed hypothetical weakly interacting channel and a blocked photon path.</desc>
<rect width="1200" height="720" fill="#171411"/>
<circle cx="600" cy="360" r="170" fill="#2b2722" stroke="#f6efe5" stroke-width="3"/>
<path d="M445 336c95 62 220 62 310 0" fill="none" stroke="#d55d3b" stroke-width="8" opacity=".4"/>
<path d="M150 330h900" stroke="#7a5db0" stroke-width="8" stroke-dasharray="16 14"/>
<path d="M1040 330l-24-14v28z" fill="#7a5db0"/>
<g transform="translate(96 250)"><rect width="118" height="150" rx="18" fill="#f6efe5"/><circle cx="59" cy="54" r="24" fill="#e7aa40"/><path d="M30 112h58" stroke="#171411" stroke-width="8"/></g>
<g transform="translate(986 250)"><rect width="118" height="150" rx="18" fill="#f6efe5"/><circle cx="59" cy="54" r="24" fill="#e7aa40"/><path d="M30 112h58" stroke="#171411" stroke-width="8"/></g>
<text x="70" y="84" fill="#f6efe5" font-family="system-ui,sans-serif" font-size="34" font-weight="700">Through-obstacle communication?</text>
<text x="70" y="592" fill="#f6efe5" font-family="system-ui,sans-serif" font-size="24">A weakly interacting messenger could penetrate matter—if it can be produced and detected.</text>
<text x="70" y="636" fill="#b9afa4" font-family="system-ui,sans-serif" font-size="18">Penetration and detectability fight each other: weaker coupling also makes the link budget harder.</text>
<rect x="70" y="674" width="510" height="2" fill="#7a5db0"/>
</svg>