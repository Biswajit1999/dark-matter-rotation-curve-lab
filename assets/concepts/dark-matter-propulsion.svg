<text x="520" y="610">1 capture?</text><text x="675" y="610">2 momentum transfer?</text><text x="900" y="610">3 net thrust?</text>
</g>
<path d="M515 628h500" stroke="#5a5249" stroke-width="2" stroke-dasharray="8 8"/>
<text x="66" y="84" fill="#f6efe5" font-family="system-ui,sans-serif" font-size="34" font-weight="700">Propulsion must close the momentum ledger</text>
<text x="66" y="655" fill="#f6efe5" font-family="system-ui,sans-serif" font-size="24">A geometric collector is not an engine unless the dark state actually transfers momentum.</text>
<text x="66" y="690" fill="#b9afa4" font-family="system-ui,sans-serif" font-size="17">No reactionless drive follows from present dark-matter evidence.</text>
