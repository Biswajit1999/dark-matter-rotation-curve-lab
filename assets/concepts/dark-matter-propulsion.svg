<ellipse cx="90" cy="120" rx="28" ry="165" fill="#f6efe5"/>
<path d="M118 120h250l100 56-100 56H118z" fill="#d55d3b"/>
<circle cx="330" cy="176" r="34" fill="#24201b" stroke="#f6efe5" stroke-width="5"/>
